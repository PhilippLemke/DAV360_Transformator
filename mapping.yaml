# "Gruppenzuprdnung"). Wird aktuell von keinem Transform verwendet - noch
# offen ist, ob/wo Gruppen künftig automatisch aus der Kategorie abgeleitet
# werden sollen (siehe Fragen.md, Punkt 4) statt wie bisher aus der
# jeweiligen Formular-Spalte "Gruppe(n)".
