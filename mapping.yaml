# Feste Zuordnung: wenn eine Tour/Veranstaltung einer festen Gruppe zugeordnet
# ist, welche Kategorie (siehe oben) bekommt sie automatisch zugewiesen.
# Nur für Gruppen mit fester Sportart relevant, sonst leer lassen.
#
# TODO: Die Gruppennamen/Kategorien unten sind noch
# Platzhalter aus dem Fork-Original und passen nicht zu den echten Trier-
# Gruppen (siehe Tabelle "gruppen" oben) oder Kategorien (siehe "kategorie"
# oben) - ohne Treffer liefert get_kategorie_for_gruppe() ohnehin nur "".
# Die Sektion hat für Kurse eine umgekehrte Zuordnung vorgeschlagen (Gruppe
# automatisch aus der Kategorie ableiten statt aus der Formular-Spalte
# "Gruppen") und einen "Zuordnungsaufschlag" (Vorschlag) angekündigt - der
# ist noch nicht eingetroffen. Bis dahin bleibt assignedGroups bei Kursen wie
# gehabt aus der Formular-Spalte "Gruppen" befüllt (siehe profiles.yaml).
gruppe_kategorie:
  Mountainbike: Mountainbike
  Mankeis: Familien
  Jugendklettergruppe: Sportklettern
  Familiengruppe: Familien
  Klettertreff: Sportklettern
  Seniorengruppe: "Senior*innen"
