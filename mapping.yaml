# Sektionsspezifische Stammdaten für den DAV360-Transformator.
# Ersetzt die frühere Keys.xlsx 1:1 als YAML. Diese Datei muss pro Sektion
# angepasst werden (IDs kommen aus dem Pimcore-Redaktionstool).
#
# Die IDs unter kategorie/technik/ausdauer/saison/eventart/klassifizierung/
# gruppen/kursstufe/bookingstate sind echte Produktions-IDs bzw. Pfade der
# Sektion Trier (264) - abgeglichen mit den realen Pimcore-Exporten bzw. den
# von der Sektion per Mail gelieferten Stammdaten. Die Personendaten
# (tourenfuehrer: Max Mustermann / Erika Musterfrau) sind Platzhalter, damit
# die Beispieldatensätze in dummy_daten/ direkt funktionieren. gruppe_kategorie
# ist weiterhin unvollständig/Platzhalter - siehe den Kommentar bei der
# Tabelle unten.

