# Sektionsspezifische Stammdaten für den DAV360-Transformator.
# Ersetzt die frühere Keys.xlsx 1:1 als YAML. Diese Datei muss pro Sektion
# angepasst werden (IDs kommen aus dem Pimcore-Redaktionstool).
#
# Die IDs unter kategorie/technik/ausdauer/saison/eventart/klassifizierung/
# gruppen sind echte Produktions-IDs bzw. Pfade der Sektion Trier (264) -
# abgeglichen mit den realen Pimcore-Exporten bzw. den von der Sektion per
# Mail gelieferten Stammdaten. Die Personendaten (tourenfuehrer: Max
# Mustermann / Erika Musterfrau) sind Platzhalter, damit die
# Beispieldatensätze in dummy_daten/ direkt funktionieren. kursstufe,
# bookingstate und gruppe_kategorie sind noch unvollständig/Platzhalter -
# siehe die TODO-Kommentare bei den jeweiligen Tabellen unten.

